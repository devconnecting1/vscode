# Secret Scanning configuration
# https://docs.github.com/en/code-security/secret-scanning/secret-scanning-patterns

# Custom patterns for this repository
custom-patterns:
  - name: VS Code Extension API Key
    pattern: '(?i)(vscode|vs[_-]?code)[-_]?(api[_-]?key|token|secret)[-_]?[=:]["'\'']\s*[A-Za-z0-9+/=_-]{20,}'

# Paths to ignore
paths-ignore:
  - "node_modules/**"
  - "out/**"
  - ".build/**"
  - "coverage/**"
  - "cli/target/**"
  - "**/*.test.ts"
  - "**/*.test.js"
  - "**/*.spec.ts"
  - "**/*.spec.js"
  - "test/**"
  - "extensions/*/test/**"
  - "extensions/*/test-workspace/**"
  - "**/fixtures/**"
  - "**/__snapshots__/**"
  - "build/**"
  - "scripts/**"
