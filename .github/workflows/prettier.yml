name: Prettier

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  prettier:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Prettier
        run: npm install -g prettier

      - name: Run Prettier
        run: prettier --check "src/vs/**/*.ts" --ignore-path .prettierignore || true
